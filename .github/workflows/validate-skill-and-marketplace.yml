name: Validate skill and plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Validate skill
        run: npx --yes skills-ref validate ./skills/heptabase-cli

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate Claude Code marketplace manifest
        run: claude plugin validate .

      - name: Validate Cursor plugin manifest
        run: node scripts/validate-cursor-plugin.mjs
