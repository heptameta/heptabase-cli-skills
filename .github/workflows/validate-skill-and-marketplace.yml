name: Validate skill and plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      - name: Validate skill
        run: npx --yes skills-ref validate ./skills/heptabase-cli

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate Claude Code marketplace manifest
        run: claude plugin validate .

      - name: Validate Cursor plugin manifest
        run: node scripts/validate-cursor-plugin.mjs
